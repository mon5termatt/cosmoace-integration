# =========================
# CosmoACE hub-less panel macros
# =========================
#
# Include this only when you have NO hub filament sensor. It exposes
# ACE_BLIND_CLEAR_HUB on the Mainsail/Fluidd macro panel.
#
# When a hub sensor IS enabled, do not include this file — the button stays
# hidden, and Orca still uses the internal _ACE_BLIND_CLEAR_HUB helper.
#
# In ace-addon.cfg (or after the main include) add:
#   [include ace_macros_nohub_panel.cfg]
#
# Or next to the symlink on CosmOS:
#   [include /etc/klipper/config/ace_macros_nohub_panel.cfg]

[gcode_macro ACE_BLIND_CLEAR_HUB]
description: Retract a fixed distance past the hub (hub-less setups only)
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set hub_name = cfg.sensor_name|string %}
  {% set has_hub = hub_name != "" and ("filament_switch_sensor " ~ hub_name) in printer %}
  {% if has_hub %}
    { action_raise_error("ACE_BLIND_CLEAR_HUB is for hub-less setups; hub sensor '" ~ hub_name ~ "' is enabled — use ACE_CLEAR_HUB (and remove ace_macros_nohub_panel.cfg from your includes)") }
  {% endif %}
  _ACE_BLIND_CLEAR_HUB {rawparams}
