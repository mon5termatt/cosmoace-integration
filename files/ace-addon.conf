[ace]
# BunnyACE / original CosmoACE style: either pin a tty, or use auto.
# auto = first free /dev/ttyACM*|/dev/ttyUSB* that is not Klipper's MCU.
# When the ACE is up it is usually /dev/ttyACM1 (Klipper owns ttyACM0).
# Do NOT point this at /dev/ttyACM0 — that is the printer MCU.
serial_port = auto
baudrate = 115200
command_timeout_s = 1.0
rpc_timeout_s = 2.5
read_idle_s = 0.08
read_max_bytes = 4096
# Light reconnect retries (same idea as BunnyACE's open loop).
connect_retries = 5
connect_retry_delay_s = 0.5
# Safe resend only for idempotent RPCs (status/stop/dryer), not motion.
rpc_retries = 2
rpc_retry_delay_s = 1.0
feed_speed = 25
retract_speed = 15
dry_fan_speed = 7000
log_path = /board-resource/ace-addon.log

[defaults]
feed_mm = 90
retract_mm = 90
dry_temp_c = 45
dry_minutes = 240

[klipper]
sensor_name = runout

[moonraker]
url = http://127.0.0.1:7125
timeout_s = 3.0

[service]
listen_host = 127.0.0.1
listen_port = 8091
