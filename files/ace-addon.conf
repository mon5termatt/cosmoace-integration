[ace]
# BunnyACE / ACEPRO style: either pin a tty, or use auto.
# auto prefers a real ACE device (pyserial description contains "ACE", or
# USB VID 28e9), and never opens the Klipper MCU. Same idea as ACEPRO's
# find_com_port('ACE') on Merc.
#
# Keep auto while the rear AMS link flaps (device numbers change). After
# ACE_CHECK stays healthy for ~10+ minutes with a stable tty, pin it:
#   serial_port = /dev/ttyACM1
serial_port = auto
baudrate = 115200
command_timeout_s = 1.0
rpc_timeout_s = 2.5
read_idle_s = 0.08
read_max_bytes = 4096
# Fail-fast reconnect while rear AMS USB flaps (disconnect every few seconds).
connect_retries = 2
connect_retry_delay_s = 0.3
# ACEPRO / AFC-ACE style: 3 protocol attempts per call with a growing backoff
# (starts at rpc_retry_delay_s, x1.5 each retry, capped at 2s) so a retry
# lands inside the next USB up-window. Only idempotent RPCs (status/stop/
# dryer) are ever resent. Motion commands are sent exactly once, after a
# retried get_status probe proves the link is alive.
rpc_retries = 3
rpc_retry_delay_s = 0.25
# Background heartbeat daemon pokes get_status this often (keeps ACE awake).
# OFF by default on Centauri: CosmOS has ~112MB RAM and an always-on Python
# poller can peg CPU/RAM and crash the UI. Enable only after ACE USB is stable.
keepalive_enabled = false
keepalive_interval_s = 1.0
lock_path = /user-resource/ace-addon/ace.lock
feed_speed = 25
retract_speed = 15
dry_fan_speed = 7000
log_path = /board-resource/ace-addon.log

[defaults]
feed_mm = 90
retract_mm = 90
dry_temp_c = 45
dry_minutes = 240

[klipper]
sensor_name = runout

[moonraker]
url = http://127.0.0.1:7125
timeout_s = 3.0
