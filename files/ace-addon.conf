[ace]
# Pin the stable /dev/serial/by-id alias. Raw /dev/ttyACM* can change at boot
# from enumeration delays (MCU vs ACE race) and again on rear-AMS flaps
# (ttyACM1 -> ttyACM2). Never pin /dev/ttyACM*. auto still works (prefers
# by-id when present) but re-scans every call and is ~3x slower; keep the pin
# once health has shown this path.
serial_port = /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
baudrate = 115200
command_timeout_s = 1.0
rpc_timeout_s = 2.5
read_idle_s = 0.08
read_max_bytes = 4096
# Fail-fast reconnect while rear AMS USB flaps (disconnect every few seconds).
connect_retries = 2
connect_retry_delay_s = 0.3
# Pause after a successful open before the first write: right after a flap the
# port opens but the ACE may not be ready yet.
connect_settle_s = 0.15
# ACEPRO / AFC-ACE style: 3 protocol attempts per call with a growing backoff
# (starts at rpc_retry_delay_s, x1.5 each retry, capped at 2s) so a retry
# lands inside the next USB up-window. Only idempotent RPCs (status/stop/
# dryer) are ever resent. Motion commands are sent exactly once, after a
# retried get_status probe proves the link is alive.
rpc_retries = 3
rpc_retry_delay_s = 0.25
# The ACE GD32 drops/re-enumerates USB every 3.584s without Anycubic protocol
# traffic. A low-priority get_status every 2s suppresses that device watchdog.
# The daemon releases the tty between ticks so CLI macros can use it.
keepalive_enabled = true
keepalive_interval_s = 2.0
# Skip keepalive while 1-minute host load is at/above this value. Protecting
# Klipper from "Timer too close" is more important than preventing one ACE reset.
keepalive_load_limit = 2.0
lock_path = /user-resource/ace-addon/ace.lock
feed_speed = 25
retract_speed = 15
dry_fan_speed = 7000
log_path = /board-resource/ace-addon.log

[defaults]
feed_mm = 90
retract_mm = 90
dry_temp_c = 45
dry_minutes = 240

[klipper]
sensor_name = HUB

[moonraker]
url = http://127.0.0.1:7125
timeout_s = 3.0
