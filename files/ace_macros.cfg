# =========================
# CosmoACE printer-side macros
# =========================
#
# Requirements:
# - The gcode_shell_command Klipper extension must be installed.
# - Your filament_switch_sensor should call _ACE_SENSOR_EVENT on insert/runout.

[gcode_shell_command ace_rpc]
command: /user-resource/ace-addon/ace-command.sh
timeout: 180.
verbose: False

[gcode_shell_command ace_rpc_verbose]
command: /user-resource/ace-addon/ace-command.sh
timeout: 180.
verbose: True

[gcode_shell_command ace_setup]
command: /user-resource/ace-addon/ace-setup.py
timeout: 120.
verbose: True

[gcode_shell_command ace_setup_restart_klipper]
command: /user-resource/ace-addon/ace-setup-restart.sh
timeout: 10.
verbose: True

[gcode_macro _ACE_CONFIG]
# Hub sensor at the 4-way merge point. Set to "" if you have no hub sensor: loads then
# search all the way to the toolhead sensor and unloads blind-retract past the hub.
variable_sensor_name: "HUB"
# Leave toolhead_sensor_name empty to fall back to a blind load_to_printhead_mm push.
variable_toolhead_sensor_name: "toolhead_runout_sensor"
variable_load_to_sensor_search_mm: 1200
variable_load_to_toolhead_search_mm: 900
# Search bound for hub-less loads: full ACE-to-toolhead run plus margin.
variable_load_to_toolhead_full_search_mm: 2200
variable_load_past_toolhead_mm: 15
variable_unload_from_toolhead_search_mm: 200
# Hub-less unload: blind retract from the toolhead sensor back past the merge point.
# Over-retracting is harmless (the ACE just spools it back), so keep this generous.
variable_unload_past_hub_mm: 950
# Only used when no toolhead sensor is configured.
variable_load_to_printhead_mm: 730
variable_unload_to_sensor_search_mm: 900
variable_unload_to_sensor_probe_mm: 10
variable_unload_to_sensor_probe_speed_mm_s: 5
variable_retract_slot_mm: 90
variable_clear_hub_step_mm: 10
variable_clear_hub_max_extra_mm: 60
variable_clear_hub_settle_s: 0.25
variable_clear_hub_confirm_s: 1.0
variable_extruder_release_mm: 30
variable_extruder_release_speed_mm_s: 4
variable_feed_speed_mm_s: 25
variable_retract_speed_mm_s: 15
variable_purge_mm: 40
variable_purge_chunk_mm: 100
variable_purge_temp: 250
variable_purge_speed_mm_s: 3
variable_dry_temp_c: 45
variable_dry_minutes: 240
variable_dry_fan_speed: 7000
variable_sync_load_mm: 40
variable_sync_load_chunk_mm: 5
variable_sync_load_settle_s: 0.25
variable_swap_lift_z: 5
variable_lift_speed_mm_s: 10
variable_return_xy_speed_mm_s: 200
variable_return_z_speed_mm_s: 10
variable_cut_x: 255
variable_cut_y: 3
variable_cut_clear_y: 30
gcode:

[gcode_macro _ACE_STATE]
variable_mode: "idle"
variable_current_slot: -1
variable_pending_slot: -1
variable_last_event: ""
variable_last_error: ""
variable_sensor_state: -1
variable_toolhead_sensor_state: -1
variable_sensors_enabled: 1
variable_return_x: 0.0
variable_return_y: 0.0
variable_return_z: 0.0
variable_has_return_position: 0
gcode:

[gcode_macro _ACE_PRE_TOOLCHANGE]
gcode:
  # no-op hook

[gcode_macro _ACE_POST_TOOLCHANGE]
gcode:
  # no-op hook

[gcode_macro ACE_SET_SENSOR_NAME]
description: Set the filament_switch_sensor object name used by ACE macros (NAME="" for hub-less)
gcode:
  {% set name = params.NAME|default("")|string %}
  SET_GCODE_VARIABLE MACRO=_ACE_CONFIG VARIABLE=sensor_name VALUE='"{name}"'
  {% if name == "" %}
    RESPOND TYPE=echo MSG="ACE sensor_name cleared (hub-less mode)"
  {% else %}
    RESPOND TYPE=echo MSG="ACE sensor_name -> {name}"
  {% endif %}

[gcode_macro _ACE_SET_SENSORS]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set enable = params.ENABLE|default(1)|int %}
  {% set target = params.TARGET|default("all")|string|lower %}
  {% set enable_flag = 1 if enable else 0 %}

  {% if target not in ("all", "hub", "toolhead") %}
    { action_raise_error("_ACE_SET_SENSORS TARGET must be all, hub, or toolhead") }
  {% endif %}

  {% if target in ("all", "hub") %}
    {% set hub_name = cfg.sensor_name|string %}
    {% set hub_object = "filament_switch_sensor " ~ hub_name %}
    {% if hub_name != "" and hub_object in printer %}
      SET_FILAMENT_SENSOR SENSOR={hub_name} ENABLE={enable_flag}
      RESPOND TYPE=echo MSG="ACE hub sensor '{hub_name}' {'enabled' if enable_flag else 'disabled'}"
    {% elif target == "hub" %}
      RESPOND TYPE=echo MSG="ACE hub sensor not configured/present"
    {% endif %}
  {% endif %}

  {% if target in ("all", "toolhead") %}
    {% set toolhead_name = cfg.toolhead_sensor_name|string %}
    {% set toolhead_object = "filament_switch_sensor " ~ toolhead_name %}
    {% if toolhead_name != "" and toolhead_object in printer %}
      SET_FILAMENT_SENSOR SENSOR={toolhead_name} ENABLE={enable_flag}
      RESPOND TYPE=echo MSG="ACE toolhead sensor '{toolhead_name}' {'enabled' if enable_flag else 'disabled'}"
    {% elif target == "toolhead" %}
      RESPOND TYPE=echo MSG="ACE toolhead sensor not configured/present"
    {% endif %}
  {% endif %}

  {% if target == "all" %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensors_enabled VALUE={enable_flag}
  {% endif %}

[gcode_macro ACE_ENABLE_SENSORS]
description: Enable hub and/or toolhead filament sensors (TARGET=all|hub|toolhead)
gcode:
  _ACE_SET_SENSORS ENABLE=1 TARGET={params.TARGET|default("all")|string}

[gcode_macro ACE_DISABLE_SENSORS]
description: Disable hub and/or toolhead filament sensors (TARGET=all|hub|toolhead)
gcode:
  _ACE_SET_SENSORS ENABLE=0 TARGET={params.TARGET|default("all")|string}

[gcode_macro _ACE_SET_MODE]
gcode:
  {% set mode = params.MODE|string %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=mode VALUE='"{mode}"'

[gcode_macro _ACE_CLEAR_RETURN_POSITION]
gcode:
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=return_x VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=return_y VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=return_z VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=has_return_position VALUE=0

[gcode_macro _ACE_SAVE_RETURN_POSITION]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("_ACE_SAVE_RETURN_POSITION requires the printer to be homed") }
  {% endif %}
  {% set pos = printer.gcode_move.gcode_position %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=return_x VALUE={pos.x}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=return_y VALUE={pos.y}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=return_z VALUE={pos.z}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=has_return_position VALUE=1

[gcode_macro _ACE_RESET_STATE]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set hub_object = "filament_switch_sensor " ~ cfg.sensor_name|string %}
  {% set sensor = printer[hub_object].filament_detected|int if hub_object in printer else -1 %}
  {% set toolhead_object = "filament_switch_sensor " ~ cfg.toolhead_sensor_name|string %}
  {% set toolhead_sensor = printer[toolhead_object].filament_detected|int if toolhead_object in printer else -1 %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE=-1
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE=-1
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=last_event VALUE='""'
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=last_error VALUE='""'
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=toolhead_sensor_state VALUE={toolhead_sensor}
  UPDATE_DELAYED_GCODE ID=_ACE_DELAYED_RESUME_PRINT DURATION=0
  _ACE_CLEAR_RETURN_POSITION
  _ACE_SET_MODE MODE=idle

[gcode_macro ACE_STATUS]
description: Print current ACE state for troubleshooting
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set sensor_name = cfg.sensor_name|string %}
  {% set hub_object = "filament_switch_sensor " ~ sensor_name %}
  {% set sensor = printer[hub_object].filament_detected|int if hub_object in printer else -1 %}
  {% set toolhead_name = cfg.toolhead_sensor_name|string %}
  {% set toolhead_object = "filament_switch_sensor " ~ toolhead_name %}
  {% set toolhead_sensor = printer[toolhead_object].filament_detected|int if toolhead_object in printer else -1 %}
  RESPOND TYPE=echo MSG="ACE mode={st.mode} current_slot={st.current_slot} pending_slot={st.pending_slot} sensor_name={sensor_name} sensor={sensor} toolhead_sensor_name={toolhead_name} toolhead_sensor={toolhead_sensor} sensors_enabled={st.sensors_enabled} saved_return={st.has_return_position} return_x={st.return_x} return_y={st.return_y} return_z={st.return_z} last_event={st.last_event} last_error={st.last_error}"

[gcode_macro ACE_CHECK]
description: Verify the ACE serial connection with a status round-trip (retries on a flaky link)
gcode:
  # Quiet shell (no Running/finished wrappers). Banner is injected via Klippy.
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="health"

# BunnyACE-style connect banner: after Klipper starts, open the ACE serial
# port and echo "ACE: Connected ..." once get_info succeeds.
[delayed_gcode _ACE_ANNOUNCE_CONNECT]
initial_duration: 8.
gcode:
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="announce-connect 30"

[gcode_macro ACE_SLOT_STATUS]
description: Query ACE slot readiness directly from the addon service
gcode:
  {% set slot = params.SLOT|int %}
  {% if slot < 1 or slot > 4 %}
    { action_raise_error("ACE_SLOT_STATUS requires SLOT=1..4") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc_verbose PARAMS="slot-status {slot}"

[gcode_macro ACE_DRY_START]
description: Start the ACE dryer. TEMP in C, DURATION or MINUTES, optional FAN
gcode:
  _ACE_DRY_START {rawparams}

[gcode_macro _ACE_DRY_START]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set temp = params.TEMP|default(cfg.dry_temp_c)|int %}
  {% if 'DURATION' in params %}
    {% set minutes = params.DURATION|int %}
  {% elif 'MINUTES' in params %}
    {% set minutes = params.MINUTES|int %}
  {% else %}
    {% set minutes = cfg.dry_minutes|int %}
  {% endif %}
  {% set fan = params.FAN|default(cfg.dry_fan_speed)|int %}

  {% if temp < 1 or temp > 65 %}
    { action_raise_error("_ACE_DRY_START requires TEMP=1..65 (ACE Pro hardware max is usually 55C)") }
  {% elif minutes < 1 %}
    { action_raise_error("_ACE_DRY_START requires DURATION/MINUTES>=1") }
  {% elif fan < 0 %}
    { action_raise_error("_ACE_DRY_START requires FAN>=0") }
  {% endif %}

  RUN_SHELL_COMMAND CMD=ace_rpc_verbose PARAMS="dry-start {temp} {minutes} {fan}"
  _ACE_SET_MODE MODE=dry

[gcode_macro ACE_DRY_STOP]
description: Stop the ACE dryer
gcode:
  _ACE_DRY_STOP

[gcode_macro _ACE_DRY_STOP]
gcode:
  RUN_SHELL_COMMAND CMD=ace_rpc_verbose PARAMS="dry-stop"
  _ACE_SET_MODE MODE=idle

[gcode_macro _ACE_ASSERT_SLOT_READY]
gcode:
  {% set slot = params.SLOT|int %}
  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_ASSERT_SLOT_READY requires SLOT=1..4") }
  {% endif %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="assert-slot-ready {slot}"

[gcode_macro _ACE_SLOT_LOAD_RAW]
gcode:
  {% set slot = params.SLOT|int %}
  {% set length = params.LENGTH|default(0)|float|int %}
  {% set speed = params.SPEED|default(0)|float|int %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed {slot} {length} {speed}"

[gcode_macro _ACE_SLOT_LOAD_WAIT_RAW]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set length = params.LENGTH|default(0)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}
  {% set timeout_s = params.TIMEOUT_S|default((length / (speed if speed > 0 else 1)) + 5)|float %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-wait {slot} {length|int} {speed|int} {timeout_s}"

[gcode_macro _ACE_SLOT_UNLOAD_RAW]
gcode:
  {% set slot = params.SLOT|int %}
  {% set length = params.LENGTH|default(0)|float|int %}
  {% set speed = params.SPEED|default(0)|float|int %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="retract {slot} {length} {speed}"

[gcode_macro _ACE_SLOT_UNLOAD_WAIT_RAW]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set length = params.LENGTH|default(0)|float %}
  {% set speed = params.SPEED|default(cfg.retract_speed_mm_s)|float %}
  {% set timeout_s = params.TIMEOUT_S|default((length / (speed if speed > 0 else 1)) + 5)|float %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="retract-wait {slot} {length|int} {speed|int} {timeout_s}"

[gcode_macro _ACE_SLOT_WAIT_IDLE_RAW]
gcode:
  {% set slot = params.SLOT|int %}
  {% set timeout_s = params.TIMEOUT_S|default(5)|float %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="wait-motion {slot} {timeout_s}"

[gcode_macro _ACE_SLOT_LOAD_TO_SENSOR_WAIT_RAW]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set length = params.LENGTH|default(cfg.load_to_sensor_search_mm)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set timeout_s = params.TIMEOUT_S|default((length / (speed if speed > 0 else 1)) + 10)|float %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="feed-to-sensor {slot} {length|int} {speed|int} {sensor_name} {timeout_s}"

[gcode_macro _ACE_SLOT_UNLOAD_TO_SENSOR_WAIT_RAW]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set length = params.LENGTH|default(cfg.unload_to_sensor_search_mm)|float %}
  {% set speed = params.SPEED|default(cfg.retract_speed_mm_s)|float %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set timeout_s = params.TIMEOUT_S|default((length / (speed if speed > 0 else 1)) + 10)|float %}
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="retract-to-sensor {slot} {length|int} {speed|int} {sensor_name} {timeout_s}"

[gcode_macro _ACE_VERIFY_SENSOR_TRIGGERED]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set sensor = printer["filament_switch_sensor " ~ sensor_name].filament_detected|int %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
  {% if not sensor %}
    { action_raise_error("_ACE_VERIFY_SENSOR_TRIGGERED failed: sensor is not triggered") }
  {% endif %}

[gcode_macro _ACE_VERIFY_SENSOR_CLEAR]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set sensor = printer["filament_switch_sensor " ~ sensor_name].filament_detected|int %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
  {% if sensor %}
    { action_raise_error("_ACE_VERIFY_SENSOR_CLEAR failed: sensor is still triggered") }
  {% endif %}

[gcode_macro _ACE_VERIFY_TOOLHEAD_TRIGGERED]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set sensor_name = params.SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set sensor = printer["filament_switch_sensor " ~ sensor_name].filament_detected|int %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=toolhead_sensor_state VALUE={sensor}
  {% if not sensor %}
    { action_raise_error("_ACE_VERIFY_TOOLHEAD_TRIGGERED failed: filament did not reach the toolhead sensor") }
  {% endif %}

[gcode_macro _ACE_VERIFY_TOOLHEAD_CLEAR]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set sensor_name = params.SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set sensor = printer["filament_switch_sensor " ~ sensor_name].filament_detected|int %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=toolhead_sensor_state VALUE={sensor}
  {% if sensor %}
    { action_raise_error("_ACE_VERIFY_TOOLHEAD_CLEAR failed: filament is still at the toolhead sensor") }
  {% endif %}

[gcode_macro _ACE_SENSOR_EVENT]
gcode:
  {% set event = params.EVENT|string|upper %}
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set is_toolhead = event.startswith("TOOLHEAD_") %}
  {% set sensor_name = (cfg.toolhead_sensor_name if is_toolhead else cfg.sensor_name)|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set sensor = printer[sensor_object].filament_detected|int if sensor_object in printer else -1 %}
  {% set mode = st.mode|string %}
  {% set print_state = printer.print_stats.state|string|lower %}
  {% set is_paused = printer.pause_resume.is_paused %}

  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=last_event VALUE='"{event}"'
  {% if is_toolhead %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=toolhead_sensor_state VALUE={sensor}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
  {% endif %}

  {% if mode == "print" and event in ("RUNOUT", "TOOLHEAD_RUNOUT") and print_state == "printing" and not is_paused %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=last_error VALUE='"runout_during_print"'
    RESPOND TYPE=echo MSG="ACE runout detected during print ({event})"
    PAUSE
  {% endif %}

[gcode_macro _ACE_PAUSE_PRINT]
gcode:
  {% if printer.pause_resume.is_paused %}
    { action_raise_error("_ACE_PAUSE_PRINT refused: printer is already paused") }
  {% elif printer.print_stats.state|string|lower != "printing" %}
    { action_raise_error("_ACE_PAUSE_PRINT requires an active print") }
  {% endif %}
  PAUSE_BASE
  RESPOND TYPE=echo MSG="Print paused for toolchange"

[gcode_macro _ACE_DROP_BED]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set lift = params.LIFT|default(cfg.swap_lift_z)|float %}
  {% set speed = params.SPEED|default(cfg.lift_speed_mm_s)|float %}
  {% set actual_lift = [lift, max_z - pos.z]|min %}

  {% if "z" not in printer.toolhead.homed_axes %}
    { action_raise_error("_ACE_DROP_BED requires Z to be homed") }
  {% elif lift <= 0 %}
    { action_raise_error("_ACE_DROP_BED requires LIFT>0") }
  {% elif actual_lift <= 0 %}
    # already at safe height
  {% else %}
    SAVE_GCODE_STATE NAME=ace_drop_bed_state
    G91
    G1 Z{actual_lift} F{speed * 60}
    M400
    RESTORE_GCODE_STATE NAME=ace_drop_bed_state
  {% endif %}

[gcode_macro _ACE_RETURN_XY]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set speed = params.SPEED|default(cfg.return_xy_speed_mm_s)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("_ACE_RETURN_XY requires the printer to be homed") }
  {% elif not st.has_return_position|int %}
    # nothing to restore
  {% else %}
    G90
    G0 X{st.return_x} Y{st.return_y} F{speed * 60}
    M400
  {% endif %}

[gcode_macro _ACE_RETURN_Z]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set speed = params.SPEED|default(cfg.return_z_speed_mm_s)|float %}

  {% if "z" not in printer.toolhead.homed_axes %}
    { action_raise_error("_ACE_RETURN_Z requires Z to be homed") }
  {% elif not st.has_return_position|int %}
    # nothing to restore
  {% else %}
    G90
    G0 Z{st.return_z} F{speed * 60}
    M400
  {% endif %}

[gcode_macro _ACE_RESUME_PRINT]
gcode:
  {% if not printer.pause_resume.is_paused %}
    { action_raise_error("_ACE_RESUME_PRINT requires a paused print") }
  {% endif %}
  _ACE_POST_TOOLCHANGE
  RESUME
  RESPOND TYPE=echo MSG="Print resumed"

[delayed_gcode _ACE_DELAYED_RESUME_PRINT]
gcode:
  {% if printer.pause_resume.is_paused %}
    _ACE_RESUME_PRINT
  {% endif %}

[gcode_macro ACE_LOAD_TO_SENSOR]
description: Feed a slot until the configured filament sensor triggers
gcode:
  _ACE_LOAD_TO_SENSOR {rawparams}

[gcode_macro _ACE_LOAD_TO_SENSOR]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set length = params.LENGTH|default(cfg.load_to_sensor_search_mm)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}

  {% if sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("_ACE_LOAD_TO_SENSOR requires a hub sensor; without one use ACE_LOAD_TO_TOOLHEAD") }
  {% endif %}
  {% set sensor = printer[sensor_object].filament_detected|int %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_LOAD_TO_SENSOR requires SLOT=1..4") }
  {% elif sensor %}
    { action_raise_error("_ACE_LOAD_TO_SENSOR refused: sensor already triggered") }
  {% endif %}

  _ACE_ASSERT_SLOT_READY SLOT={slot}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=last_error VALUE='""'
  _ACE_SET_MODE MODE=load_to_sensor
  _ACE_SLOT_LOAD_TO_SENSOR_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed} SENSOR={sensor_name}
  _ACE_VERIFY_SENSOR_TRIGGERED SENSOR={sensor_name}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE=1
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Filament loaded to sensor: slot {slot}"

[gcode_macro ACE_LOAD_TO_PRINTHEAD]
description: Advance the pending slot from the hub sensor to the printhead
gcode:
  _ACE_LOAD_TO_PRINTHEAD {rawparams}

[gcode_macro _ACE_LOAD_TO_PRINTHEAD]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.pending_slot)|int %}
  {% set hub_name = cfg.sensor_name|string %}
  {% set hub_object = "filament_switch_sensor " ~ hub_name %}
  {% set has_hub = hub_name != "" and hub_object in printer %}
  {% set toolhead_name = params.TOOLHEAD_SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set has_toolhead = toolhead_name != "" and ("filament_switch_sensor " ~ toolhead_name) in printer %}
  {% set default_search = cfg.load_to_toolhead_search_mm if has_hub else cfg.load_to_toolhead_full_search_mm %}
  {% set search = params.SEARCH|default(default_search)|float %}
  {% set past = params.PAST|default(cfg.load_past_toolhead_mm)|float %}
  {% set length = params.LENGTH|default(cfg.load_to_printhead_mm)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_LOAD_TO_PRINTHEAD requires SLOT=1..4 or a pending slot") }
  {% elif not has_hub and not has_toolhead %}
    { action_raise_error("_ACE_LOAD_TO_PRINTHEAD requires at least one of hub sensor or toolhead sensor") }
  {% elif has_hub and not printer[hub_object].filament_detected|int %}
    { action_raise_error("_ACE_LOAD_TO_PRINTHEAD refused: hub sensor is not triggered, load to the hub first") }
  {% endif %}

  {% if not has_hub %}
    RESPOND TYPE=echo MSG="No hub sensor: searching up to {search}mm for the toolhead sensor"
  {% endif %}
  {% if has_toolhead %}
    _ACE_LOAD_TO_TOOLHEAD SLOT={slot} SEARCH={search} PAST={past} SPEED={speed} SENSOR={toolhead_name}
  {% else %}
    _ACE_SET_MODE MODE=load_to_printhead
    _ACE_SLOT_LOAD_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE={slot}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
    _ACE_SET_MODE MODE=idle
    RESPOND TYPE=echo MSG="Filament loaded to printhead: slot {slot} (blind {length}mm push, no toolhead sensor)"
  {% endif %}

[gcode_macro ACE_LOAD_TO_TOOLHEAD]
description: Feed a slot until the toolhead sensor triggers, then push a short distance into the extruder
gcode:
  _ACE_LOAD_TO_TOOLHEAD {rawparams}

[gcode_macro _ACE_LOAD_TO_TOOLHEAD]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.pending_slot)|int %}
  {% set sensor_name = params.SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set search = params.SEARCH|default(cfg.load_to_toolhead_search_mm)|float %}
  {% set past = params.PAST|default(cfg.load_past_toolhead_mm)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_LOAD_TO_TOOLHEAD requires SLOT=1..4 or a pending slot") }
  {% elif sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("_ACE_LOAD_TO_TOOLHEAD refused: toolhead sensor '" ~ sensor_name ~ "' is not configured") }
  {% elif printer[sensor_object].filament_detected|int %}
    { action_raise_error("_ACE_LOAD_TO_TOOLHEAD refused: toolhead sensor is already triggered, clear the extruder first") }
  {% elif search <= 0 %}
    { action_raise_error("_ACE_LOAD_TO_TOOLHEAD requires SEARCH>0") }
  {% elif past < 0 %}
    { action_raise_error("_ACE_LOAD_TO_TOOLHEAD requires PAST>=0") }
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=last_error VALUE='""'
  _ACE_SET_MODE MODE=load_to_toolhead
  _ACE_SLOT_LOAD_TO_SENSOR_WAIT_RAW SLOT={slot} LENGTH={search} SPEED={speed} SENSOR={sensor_name}
  _ACE_VERIFY_TOOLHEAD_TRIGGERED SENSOR={sensor_name}
  {% if past > 0 %}
    _ACE_SLOT_LOAD_WAIT_RAW SLOT={slot} LENGTH={past} SPEED={speed}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE={slot}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Filament reached the toolhead sensor: slot {slot} (+{past}mm into the extruder)"

[gcode_macro ACE_UNLOAD_FROM_TOOLHEAD]
description: Retract the active slot until the toolhead sensor clears
gcode:
  _ACE_UNLOAD_FROM_TOOLHEAD {rawparams}

[gcode_macro _ACE_UNLOAD_FROM_TOOLHEAD]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set sensor_name = params.SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set length = params.LENGTH|default(cfg.unload_from_toolhead_search_mm)|float %}
  {% set speed = params.SPEED|default(cfg.retract_speed_mm_s)|float %}

  {% if sensor_name == "" or sensor_object not in printer %}
    RESPOND TYPE=echo MSG="Toolhead unload skipped: no toolhead sensor configured"
  {% elif slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_UNLOAD_FROM_TOOLHEAD requires SLOT=1..4 or a current slot") }
  {% elif not printer[sensor_object].filament_detected|int %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=toolhead_sensor_state VALUE=0
    RESPOND TYPE=echo MSG="Filament already clear at the toolhead sensor: slot {slot}"
  {% else %}
    _ACE_SET_MODE MODE=unload_from_toolhead
    _ACE_SLOT_UNLOAD_TO_SENSOR_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed} SENSOR={sensor_name}
    _ACE_VERIFY_TOOLHEAD_CLEAR SENSOR={sensor_name}
    _ACE_SET_MODE MODE=idle
    RESPOND TYPE=echo MSG="Filament pulled clear of the toolhead sensor: slot {slot}"
  {% endif %}

[gcode_macro ACE_UNLOAD_TO_SENSOR]
description: Retract the active slot until the configured filament sensor clears
gcode:
  _ACE_UNLOAD_TO_SENSOR {rawparams}

[gcode_macro _ACE_UNLOAD_TO_SENSOR]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set length = params.LENGTH|default(cfg.unload_to_sensor_search_mm)|float %}
  {% set speed = params.SPEED|default(cfg.retract_speed_mm_s)|float %}

  {% if sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("_ACE_UNLOAD_TO_SENSOR requires a hub sensor; without one use _ACE_BLIND_CLEAR_HUB (or enable ace_macros_nohub_panel.cfg)") }
  {% endif %}
  {% set sensor = printer[sensor_object].filament_detected|int %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_UNLOAD_TO_SENSOR requires SLOT=1..4 or a current slot") }
  {% elif not sensor %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE=0
    _ACE_SET_MODE MODE=idle
    RESPOND TYPE=echo MSG="Filament already clear at sensor: slot {slot}"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE={slot}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=last_error VALUE='""'
    _ACE_SET_MODE MODE=unload_to_sensor
    _ACE_SLOT_UNLOAD_TO_SENSOR_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed} SENSOR={sensor_name}
    _ACE_VERIFY_SENSOR_CLEAR SENSOR={sensor_name}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE=0
    _ACE_SET_MODE MODE=idle
    RESPOND TYPE=echo MSG="Filament unloaded to sensor: slot {slot}"
  {% endif %}

[gcode_macro ACE_RETRACT_SLOT]
description: Retract the active slot a short distance past the sensor to clear the hub
gcode:
  _ACE_RETRACT_SLOT {rawparams}

[gcode_macro _ACE_RETRACT_SLOT]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set length = params.LENGTH|default(cfg.retract_slot_mm)|float %}
  {% set speed = params.SPEED|default(cfg.retract_speed_mm_s)|float %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_RETRACT_SLOT requires SLOT=1..4 or a current slot") }
  {% endif %}

  _ACE_SET_MODE MODE=retract_slot
  _ACE_SLOT_UNLOAD_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed}
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Filament retracted past sensor: slot {slot}"

[gcode_macro ACE_CLEAR_HUB]
description: Retract the active slot until the hub path is confirmed clear at the filament sensor
gcode:
  _ACE_CLEAR_HUB {rawparams}

[gcode_macro _ACE_CLEAR_HUB]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set base_length = params.LENGTH|default(cfg.retract_slot_mm)|float %}
  {% set step = params.STEP|default(cfg.clear_hub_step_mm)|float %}
  {% set max_extra = params.MAX_EXTRA|default(cfg.clear_hub_max_extra_mm)|float %}
  {% set speed = params.SPEED|default(cfg.retract_speed_mm_s)|float %}
  {% set settle_ms = (params.SETTLE_S|default(cfg.clear_hub_settle_s)|float * 1000)|int %}
  {% set confirm_s = params.CONFIRM_S|default(cfg.clear_hub_confirm_s)|float %}

  {% if sensor_name == "" or ("filament_switch_sensor " ~ sensor_name) not in printer %}
    { action_raise_error("_ACE_CLEAR_HUB requires a hub sensor; without one use _ACE_BLIND_CLEAR_HUB (or enable ace_macros_nohub_panel.cfg)") }
  {% elif slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_CLEAR_HUB requires SLOT=1..4 or a current slot") }
  {% elif base_length <= 0 %}
    { action_raise_error("_ACE_CLEAR_HUB requires LENGTH>0") }
  {% elif step <= 0 %}
    { action_raise_error("_ACE_CLEAR_HUB requires STEP>0") }
  {% elif max_extra < 0 %}
    { action_raise_error("_ACE_CLEAR_HUB requires MAX_EXTRA>=0") }
  {% elif confirm_s < 0 %}
    { action_raise_error("_ACE_CLEAR_HUB requires CONFIRM_S>=0") }
  {% endif %}

  _ACE_SET_MODE MODE=clear_hub
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="clear-hub {slot} {base_length|int} {step|int} {max_extra|int} {speed|int} {sensor_name} {(settle_ms / 1000.0)} {confirm_s}"
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE=0
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Hub cleared: slot {slot}"

# Public ACE_BLIND_CLEAR_HUB lives in ace_macros_nohub_panel.cfg so it stays off
# the Mainsail/Fluidd panel when a hub sensor is enabled. Orca flows call the
# hidden implementation below directly.
[gcode_macro _ACE_BLIND_CLEAR_HUB]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set length = params.LENGTH|default(cfg.unload_past_hub_mm)|float %}
  {% set speed = params.SPEED|default(cfg.retract_speed_mm_s)|float %}
  {% set toolhead_name = params.TOOLHEAD_SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set toolhead_object = "filament_switch_sensor " ~ toolhead_name %}
  {% set hub_name = cfg.sensor_name|string %}
  {% set has_hub = hub_name != "" and ("filament_switch_sensor " ~ hub_name) in printer %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_BLIND_CLEAR_HUB requires SLOT=1..4 or a current slot") }
  {% elif length <= 0 %}
    { action_raise_error("_ACE_BLIND_CLEAR_HUB requires LENGTH>0") }
  {% elif toolhead_name != "" and toolhead_object in printer and printer[toolhead_object].filament_detected|int %}
    { action_raise_error("_ACE_BLIND_CLEAR_HUB refused: toolhead sensor is still triggered, unload from the toolhead first") }
  {% endif %}

  _ACE_SET_MODE MODE=blind_clear_hub
  _ACE_SLOT_UNLOAD_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed}
  {% if has_hub %}
    # A hub sensor is still installed, so use it to validate the blind distance.
    _ACE_VERIFY_SENSOR_CLEAR SENSOR={hub_name}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE=0
  {% endif %}
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Blind hub clear: slot {slot} retracted {length}mm"

[gcode_macro ACE_PROBE_SENSOR_OUT]
description: Retract a short distance and report whether the filament sensor is clear
gcode:
  _ACE_PROBE_SENSOR_OUT {rawparams}

[gcode_macro _ACE_PROBE_SENSOR_OUT]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot)|int %}
  {% set length = params.LENGTH|default(cfg.unload_to_sensor_probe_mm)|float %}
  {% set speed = params.SPEED|default(cfg.unload_to_sensor_probe_speed_mm_s)|float %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_PROBE_SENSOR_OUT requires SLOT=1..4 or a current slot") }
  {% endif %}

  _ACE_SLOT_UNLOAD_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed}
  _ACE_REPORT_SENSOR_OUT SLOT={slot}

[gcode_macro _ACE_REPORT_SENSOR_OUT]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set sensor_name = cfg.sensor_name|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% if sensor_name == "" or sensor_object not in printer %}
    RESPOND TYPE=echo MSG="ACE probe-out slot {slot}: no hub sensor configured"
  {% else %}
    {% set sensor = printer[sensor_object].filament_detected|int %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
    {% if sensor %}
      RESPOND TYPE=echo MSG="ACE probe-out slot {slot}: sensor still triggered"
    {% else %}
      RESPOND TYPE=echo MSG="ACE probe-out slot {slot}: sensor clear"
    {% endif %}
  {% endif %}

[gcode_macro ACE_PROBE_SENSOR_IN]
description: Feed a short distance and report whether the filament sensor is triggered
gcode:
  _ACE_PROBE_SENSOR_IN {rawparams}

[gcode_macro _ACE_PROBE_SENSOR_IN]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot if st.current_slot|int > 0 else st.pending_slot)|int %}
  {% set length = params.LENGTH|default(cfg.unload_to_sensor_probe_mm)|float %}
  {% set speed = params.SPEED|default(cfg.feed_speed_mm_s)|float %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_PROBE_SENSOR_IN requires SLOT=1..4 or an active slot") }
  {% endif %}

  _ACE_SLOT_LOAD_WAIT_RAW SLOT={slot} LENGTH={length} SPEED={speed}
  _ACE_REPORT_SENSOR_IN SLOT={slot}

[gcode_macro _ACE_REPORT_SENSOR_IN]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set sensor_name = cfg.sensor_name|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% if sensor_name == "" or sensor_object not in printer %}
    RESPOND TYPE=echo MSG="ACE probe-in slot {slot}: no hub sensor configured"
  {% else %}
    {% set sensor = printer[sensor_object].filament_detected|int %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=sensor_state VALUE={sensor}
    {% if sensor %}
      RESPOND TYPE=echo MSG="ACE probe-in slot {slot}: sensor triggered"
    {% else %}
      RESPOND TYPE=echo MSG="ACE probe-in slot {slot}: sensor not triggered"
    {% endif %}
  {% endif %}

[gcode_macro _ACE_MOVE_TO_PURGE]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("_ACE_MOVE_TO_PURGE requires the printer to be homed") }
  {% endif %}
  MOVE_TO_TRAY
  M400

[gcode_macro _ACE_HEAT_FOR_PURGE]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set temp = params.TEMP|default(cfg.purge_temp)|int %}
  M109 S{temp}

[gcode_macro ACE_PURGE]
description: Purge only, assuming the nozzle is already at the purge location and temperature
gcode:
  _ACE_PURGE {rawparams}

[gcode_macro _ACE_PURGE]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set length = params.LENGTH|default(cfg.purge_mm)|float %}
  {% set chunk = params.CHUNK|default(cfg.purge_chunk_mm)|float %}
  {% set speed = params.SPEED|default(cfg.purge_speed_mm_s)|float %}
  {% set chunk_count = ((length / chunk) if chunk > 0 else 0)|int %}
  {% set remainder = length - (chunk_count * chunk) %}

  {% if length <= 0 %}
    { action_raise_error("_ACE_PURGE requires LENGTH>0") }
  {% elif chunk <= 0 %}
    { action_raise_error("_ACE_PURGE requires CHUNK>0") }
  {% elif speed <= 0 %}
    { action_raise_error("_ACE_PURGE requires SPEED>0") }
  {% elif not printer.extruder.can_extrude %}
    { action_raise_error("_ACE_PURGE refused: nozzle is below min_extrude_temp") }
  {% endif %}

  _ACE_SET_MODE MODE=purge
  SAVE_GCODE_STATE NAME=ace_purge_state
  M83
  G92 E0
  {% for _ in range(chunk_count) %}
    G1 E{chunk} F{speed * 60}
  {% endfor %}
  {% if remainder > 0.001 %}
    G1 E{remainder} F{speed * 60}
  {% endif %}
  M400
  RESTORE_GCODE_STATE NAME=ace_purge_state
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Purged filament: {length}mm"

[gcode_macro ACE_SYNC_LOAD]
description: Feed the ACE and extruder together in small chunks to pull filament through the hotend
gcode:
  _ACE_SYNC_LOAD {rawparams}

[gcode_macro _ACE_SYNC_LOAD]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set slot = params.SLOT|default(st.current_slot if st.current_slot|int > 0 else st.pending_slot)|int %}
  {% set length = params.LENGTH|default(cfg.sync_load_mm)|float %}
  {% set chunk = params.CHUNK|default(cfg.sync_load_chunk_mm)|float %}
  {% set extruder_speed = params.SPEED|default(cfg.purge_speed_mm_s)|float %}
  {% set ace_speed = params.ACE_SPEED|default(extruder_speed)|float %}
  {% set settle_ms = (params.SETTLE_S|default(cfg.sync_load_settle_s)|float * 1000)|int %}
  {% set chunk_count = ((length / chunk) if chunk > 0 else 0)|int %}
  {% set remainder = length - (chunk_count * chunk) %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_SYNC_LOAD requires SLOT=1..4 or a current slot") }
  {% elif length <= 0 %}
    { action_raise_error("_ACE_SYNC_LOAD requires LENGTH>0") }
  {% elif chunk <= 0 %}
    { action_raise_error("_ACE_SYNC_LOAD requires CHUNK>0") }
  {% elif extruder_speed <= 0 or ace_speed <= 0 %}
    { action_raise_error("_ACE_SYNC_LOAD requires SPEED>0 and ACE_SPEED>0") }
  {% elif not printer.extruder.can_extrude %}
    { action_raise_error("_ACE_SYNC_LOAD refused: nozzle is below min_extrude_temp") }
  {% endif %}

  _ACE_SET_MODE MODE=sync_load
  SAVE_GCODE_STATE NAME=ace_sync_load_state
  M83
  {% for _ in range(chunk_count) %}
    {% set timeout_s = (chunk / (ace_speed if ace_speed > 0 else 1)) + 5 %}
    _ACE_SLOT_LOAD_RAW SLOT={slot} LENGTH={chunk} SPEED={ace_speed}
    G1 E{chunk} F{extruder_speed * 60}
    M400
    _ACE_SLOT_WAIT_IDLE_RAW SLOT={slot} TIMEOUT_S={timeout_s}
    {% if settle_ms > 0 %}
      G4 P{settle_ms}
    {% endif %}
  {% endfor %}
  {% if remainder > 0.001 %}
    {% set timeout_s = (remainder / (ace_speed if ace_speed > 0 else 1)) + 5 %}
    _ACE_SLOT_LOAD_RAW SLOT={slot} LENGTH={remainder} SPEED={ace_speed}
    G1 E{remainder} F{extruder_speed * 60}
    M400
    _ACE_SLOT_WAIT_IDLE_RAW SLOT={slot} TIMEOUT_S={timeout_s}
    {% if settle_ms > 0 %}
      G4 P{settle_ms}
    {% endif %}
  {% endif %}
  RESTORE_GCODE_STATE NAME=ace_sync_load_state
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE={slot}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Filament synced through hotend: slot {slot}"

[gcode_macro ACE_WIPE]
description: Wipe the nozzle at the tray
gcode:
  _ACE_WIPE

[gcode_macro _ACE_WIPE]
gcode:
  _ACE_SET_MODE MODE=wipe
  M729
  M400
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Wipe complete"

[gcode_macro _ACE_CUT_FILAMENT]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set release_mm = params.RELEASE_MM|default(cfg.extruder_release_mm)|float %}
  {% set release_speed = params.RELEASE_SPEED|default(cfg.extruder_release_speed_mm_s)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("_ACE_CUT_FILAMENT requires the printer to be homed") }
  {% endif %}

  _ACE_SET_MODE MODE=cut
  G90
  G0 Y{cfg.cut_clear_y} F15000
  G0 X{cfg.cut_x} F8000
  G0 Y{cfg.cut_y} F1200
  G0 Y{cfg.cut_clear_y} F8000
  M400
  FORCE_MOVE STEPPER=extruder DISTANCE=-{release_mm} VELOCITY={release_speed}
  M400
  _ACE_SET_MODE MODE=idle
  RESPOND TYPE=echo MSG="Filament cut"

[gcode_macro _ACE_ORCA_START]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set slot = params.SLOT|int %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set has_hub = sensor_name != "" and ("filament_switch_sensor " ~ sensor_name) in printer %}
  {% set toolhead_sensor_name = params.TOOLHEAD_SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set load_length = params.LOAD_LENGTH|default(cfg.load_to_sensor_search_mm)|float %}
  {% set load_speed = params.LOAD_SPEED|default(cfg.feed_speed_mm_s)|float %}
  {% set push_length = params.PUSH_LENGTH|default(cfg.load_to_printhead_mm)|float %}
  {% set search_length = params.SEARCH_LENGTH|default(cfg.load_to_toolhead_search_mm if has_hub else cfg.load_to_toolhead_full_search_mm)|float %}
  {% set past_length = params.PAST_LENGTH|default(cfg.load_past_toolhead_mm)|float %}
  {% set temp = params.TEMP|default(cfg.purge_temp)|int %}
  {% set sync_length = params.SYNC_LENGTH|default(cfg.sync_load_mm)|float %}
  {% set purge_length = params.PURGE|default(cfg.purge_mm)|float %}
  {% set extruder_speed = params.SPEED|default(cfg.purge_speed_mm_s)|float %}
  {% set ace_speed = params.ACE_SPEED|default(extruder_speed)|float %}
  {% set chunk = params.CHUNK|default(cfg.sync_load_chunk_mm)|float %}
  {% set wipe = params.WIPE|default(1)|int %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_ORCA_START requires SLOT=1..4") }
  {% endif %}

  CLEAR_PAUSE
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _ACE_RESET_STATE
  _ACE_ASSERT_SLOT_READY SLOT={slot}
  _ACE_MOVE_TO_PURGE
  {% if has_hub %}
    _ACE_LOAD_TO_SENSOR SLOT={slot} LENGTH={load_length} SPEED={load_speed} SENSOR={sensor_name}
    G4 P500
  {% endif %}
  _ACE_LOAD_TO_PRINTHEAD SLOT={slot} LENGTH={push_length} SEARCH={search_length} PAST={past_length} SPEED={load_speed} TOOLHEAD_SENSOR={toolhead_sensor_name}
  _ACE_HEAT_FOR_PURGE TEMP={temp}
  _ACE_SYNC_LOAD SLOT={slot} LENGTH={sync_length} SPEED={extruder_speed} ACE_SPEED={ace_speed} CHUNK={chunk}
  _ACE_PURGE LENGTH={purge_length} SPEED={extruder_speed}
  {% if wipe %}
    _ACE_WIPE
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE={slot}
  SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={slot}
  _ACE_SET_MODE MODE=print

[gcode_macro _ACE_ORCA_TOOLCHANGE]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set next_slot = params.SLOT|int %}
  {% set current_slot = st.current_slot|int %}
  {% set print_state = printer.print_stats.state|string|lower %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set has_hub = sensor_name != "" and ("filament_switch_sensor " ~ sensor_name) in printer %}
  {% set unload_length = params.UNLOAD_LENGTH|default(cfg.unload_to_sensor_search_mm)|float %}
  {% set unload_speed = params.UNLOAD_SPEED|default(cfg.retract_speed_mm_s)|float %}
  {% set retract_length = params.RETRACT_LENGTH|default(cfg.retract_slot_mm)|float %}
  {% set blind_clear_length = params.BLIND_CLEAR_LENGTH|default(cfg.unload_past_hub_mm)|float %}
  {% set toolhead_sensor_name = params.TOOLHEAD_SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set toolhead_unload_length = params.TOOLHEAD_UNLOAD_LENGTH|default(cfg.unload_from_toolhead_search_mm)|float %}
  {% set load_length = params.LOAD_LENGTH|default(cfg.load_to_sensor_search_mm)|float %}
  {% set load_speed = params.LOAD_SPEED|default(cfg.feed_speed_mm_s)|float %}
  {% set push_length = params.PUSH_LENGTH|default(cfg.load_to_printhead_mm)|float %}
  {% set search_length = params.SEARCH_LENGTH|default(cfg.load_to_toolhead_search_mm if has_hub else cfg.load_to_toolhead_full_search_mm)|float %}
  {% set past_length = params.PAST_LENGTH|default(cfg.load_past_toolhead_mm)|float %}
  {% set temp = params.TEMP|default(cfg.purge_temp)|int %}
  {% set sync_length = params.SYNC_LENGTH|default(cfg.sync_load_mm)|float %}
  {% set purge_length = params.PURGE|default(cfg.purge_mm)|float %}
  {% set extruder_speed = params.SPEED|default(cfg.purge_speed_mm_s)|float %}
  {% set ace_speed = params.ACE_SPEED|default(extruder_speed)|float %}
  {% set chunk = params.CHUNK|default(cfg.sync_load_chunk_mm)|float %}
  {% set wipe = params.WIPE|default(1)|int %}

  {% if next_slot < 1 or next_slot > 4 %}
    { action_raise_error("_ACE_ORCA_TOOLCHANGE requires SLOT=1..4") }
  {% elif print_state != "printing" %}
    { action_raise_error("_ACE_ORCA_TOOLCHANGE requires an active print") }
  {% elif printer.pause_resume.is_paused %}
    { action_raise_error("_ACE_ORCA_TOOLCHANGE refused: printer is already paused") }
  {% elif current_slot < 1 or current_slot > 4 %}
    { action_raise_error("_ACE_ORCA_TOOLCHANGE requires current_slot to be set") }
  {% elif next_slot == current_slot %}
    RESPOND TYPE=echo MSG="Toolchange skipped: slot {next_slot} already active"
  {% else %}
    _ACE_ASSERT_SLOT_READY SLOT={next_slot}
    _ACE_PRE_TOOLCHANGE
    _ACE_SAVE_RETURN_POSITION
    _ACE_PAUSE_PRINT
    G4 P250
    _ACE_DROP_BED
    _ACE_CUT_FILAMENT
    _ACE_MOVE_TO_PURGE
    _ACE_UNLOAD_FROM_TOOLHEAD SLOT={current_slot} LENGTH={toolhead_unload_length} SPEED={unload_speed} SENSOR={toolhead_sensor_name}
    {% if has_hub %}
      ACE_UNLOAD_TO_SENSOR SLOT={current_slot} LENGTH={unload_length} SPEED={unload_speed} SENSOR={sensor_name}
      G4 P500
      ACE_CLEAR_HUB SLOT={current_slot} LENGTH={retract_length} SENSOR={sensor_name}
    {% else %}
      _ACE_BLIND_CLEAR_HUB SLOT={current_slot} LENGTH={blind_clear_length} SPEED={unload_speed} TOOLHEAD_SENSOR={toolhead_sensor_name}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE=-1
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={next_slot}
    {% if has_hub %}
      _ACE_LOAD_TO_SENSOR SLOT={next_slot} LENGTH={load_length} SPEED={load_speed} SENSOR={sensor_name}
      G4 P500
    {% endif %}
    _ACE_LOAD_TO_PRINTHEAD SLOT={next_slot} LENGTH={push_length} SEARCH={search_length} PAST={past_length} SPEED={load_speed} TOOLHEAD_SENSOR={toolhead_sensor_name}
    _ACE_HEAT_FOR_PURGE TEMP={temp}
    _ACE_SYNC_LOAD SLOT={next_slot} LENGTH={sync_length} SPEED={extruder_speed} ACE_SPEED={ace_speed} CHUNK={chunk}
    _ACE_PURGE LENGTH={purge_length} SPEED={extruder_speed}
    {% if wipe %}
      _ACE_WIPE
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=current_slot VALUE={next_slot}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=pending_slot VALUE={next_slot}
    _ACE_SET_MODE MODE=print
    _ACE_RETURN_XY
    _ACE_RETURN_Z
    UPDATE_DELAYED_GCODE ID=_ACE_DELAYED_RESUME_PRINT DURATION=0.1
  {% endif %}

[gcode_macro _ACE_ORCA_END_PRINT]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_STATE"] %}
  {% set current_slot = st.current_slot|int %}
  {% set sensor_name = params.SENSOR|default(cfg.sensor_name)|string %}
  {% set has_hub = sensor_name != "" and ("filament_switch_sensor " ~ sensor_name) in printer %}
  {% set toolhead_sensor_name = params.TOOLHEAD_SENSOR|default(cfg.toolhead_sensor_name)|string %}
  {% set toolhead_unload_length = params.TOOLHEAD_UNLOAD_LENGTH|default(cfg.unload_from_toolhead_search_mm)|float %}
  {% set unload_length = params.UNLOAD_LENGTH|default(cfg.unload_to_sensor_search_mm)|float %}
  {% set unload_speed = params.UNLOAD_SPEED|default(cfg.retract_speed_mm_s)|float %}
  {% set retract_length = params.RETRACT_LENGTH|default(cfg.retract_slot_mm)|float %}
  {% set blind_clear_length = params.BLIND_CLEAR_LENGTH|default(cfg.unload_past_hub_mm)|float %}

  {% if current_slot < 1 or current_slot > 4 %}
    M104 S0
    _ACE_RESET_STATE
    RESPOND TYPE=echo MSG="End clear skipped: no active slot"
  {% else %}
    _ACE_DROP_BED
    _ACE_CUT_FILAMENT
    _ACE_MOVE_TO_PURGE
    M104 S0
    _ACE_UNLOAD_FROM_TOOLHEAD SLOT={current_slot} LENGTH={toolhead_unload_length} SPEED={unload_speed} SENSOR={toolhead_sensor_name}
    {% if has_hub %}
      ACE_UNLOAD_TO_SENSOR SLOT={current_slot} LENGTH={unload_length} SPEED={unload_speed} SENSOR={sensor_name}
      ACE_CLEAR_HUB SLOT={current_slot} LENGTH={retract_length} SENSOR={sensor_name}
    {% else %}
      _ACE_BLIND_CLEAR_HUB SLOT={current_slot} LENGTH={blind_clear_length} SPEED={unload_speed} TOOLHEAD_SENSOR={toolhead_sensor_name}
    {% endif %}
    _ACE_RESET_STATE
    RESPOND TYPE=echo MSG="End clear complete: slot {current_slot}"
  {% endif %}

[gcode_macro _ACE_TOOL_SELECT]
gcode:
  {% set slot = params.SLOT|int %}
  {% set print_state = printer.print_stats.state|string|lower %}
  {% set current_slot = printer["gcode_macro _ACE_STATE"].current_slot|int %}

  {% if slot < 1 or slot > 4 %}
    { action_raise_error("_ACE_TOOL_SELECT requires SLOT=1..4") }
  {% elif print_state == "printing" %}
    _ACE_ORCA_TOOLCHANGE SLOT={slot}
  {% elif current_slot == slot %}
    RESPOND TYPE=echo MSG="Tool {slot} already active"
  {% else %}
    RESPOND TYPE=echo MSG="Tool select ignored outside print: slot {slot}"
  {% endif %}

[gcode_macro T0]
gcode:
  _ACE_TOOL_SELECT SLOT=1

[gcode_macro T1]
gcode:
  _ACE_TOOL_SELECT SLOT=2

[gcode_macro T2]
gcode:
  _ACE_TOOL_SELECT SLOT=3

[gcode_macro T3]
gcode:
  _ACE_TOOL_SELECT SLOT=4

# ---------------------------------------------------------------------------
# Hub-less (nohub) Mainsail panel button
# ---------------------------------------------------------------------------
# ACE_BLIND_CLEAR_HUB is intentionally NOT registered here. Leading-underscore
# macros stay off the Mainsail/Fluidd panel, so hub installs don't see a
# nohub-only button.
#
# When you have NO hub sensor, copy files/ace_macros_nohub_panel.cfg next to
# this file and uncomment the include below to expose ACE_BLIND_CLEAR_HUB:
#
# [include ace_macros_nohub_panel.cfg]
#
# Install path example on CosmOS:
#   cp files/ace_macros_nohub_panel.cfg /etc/klipper/config/
#   [include /etc/klipper/config/ace_macros_nohub_panel.cfg]
#

# =========================
# ACE Initial Setup Wizard
# =========================
# First post-install prompt unless /user-resource/ace-addon/setup_complete exists.
# Manual re-run: ACE_INITIAL_SETUP (clears completion and starts over).
# Hub path: configure managed ace-hardware.cfg, restart, test lanes 1-4 slowly
# to the hub sensor and retract clear. Hub-less: configure and finish.

[gcode_macro _ACE_SETUP_STATE]
variable_active: 0
variable_hub_mode: -1
variable_lane: 1
variable_last_error: ""
gcode:

[delayed_gcode _ACE_SETUP_BOOT]
initial_duration: 12.
gcode:
  # First-run / post-restart resume. Quiet if setup_complete already exists.
  RUN_SHELL_COMMAND CMD=ace_setup PARAMS="boot"

[gcode_macro _ACE_SETUP_CLOSE_PROMPT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _ACE_SETUP_ASSERT_IDLE]
gcode:
  {% set print_state = printer.print_stats.state|string|lower %}
  {% if print_state == "printing" or printer.pause_resume.is_paused %}
    { action_raise_error("ACE setup refused: printer is printing or paused") }
  {% endif %}

[gcode_macro ACE_INITIAL_SETUP]
description: Guided first-install ACE hub / lane setup wizard
gcode:
  _ACE_SETUP_ASSERT_IDLE
  {% set st = printer["gcode_macro _ACE_SETUP_STATE"] %}
  {% set force = params.FORCE|default(0)|int %}
  {% if st.active|int and st.hub_mode|int == 1 and st.lane|int >= 1 and st.lane|int <= 4 and force == 0 %}
    # Resume after a failed lane test (macro abort leaves active=1).
    _ACE_SETUP_PROMPT_LANE_FAIL
  {% else %}
    RUN_SHELL_COMMAND CMD=ace_setup PARAMS="clear_complete"
    SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=hub_mode VALUE=-1
    SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=lane VALUE=1
    SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=last_error VALUE='""'
    _ACE_SETUP_PROMPT_HUB
  {% endif %}

[gcode_macro ACE_SETUP_RETRY]
description: Retry the current ACE setup lane test after a failure
gcode:
  _ACE_SETUP_ASSERT_IDLE
  {% set st = printer["gcode_macro _ACE_SETUP_STATE"] %}
  {% if not st.active|int %}
    { action_raise_error("ACE_SETUP_RETRY refused: setup is not active (run ACE_INITIAL_SETUP)") }
  {% endif %}
  _ACE_SETUP_PROMPT_LANE

[gcode_macro _ACE_SETUP_PROMPT_HUB]
gcode:
  _ACE_SETUP_CLOSE_PROMPT
  RESPOND TYPE=command MSG="action:prompt_begin ACE Initial Setup"
  RESPOND TYPE=command MSG="action:prompt_text Welcome to CosmoACE setup."
  RESPOND TYPE=command MSG="action:prompt_text Is the 4-way hub filament sensor installed on PC0?"
  RESPOND TYPE=command MSG="action:prompt_text Yes: write managed hub config, set sensor_name=HUB, restart Klipper, then test lanes 1-4."
  RESPOND TYPE=command MSG="action:prompt_text No: hub-less mode (sensor_name empty). Lane-to-hub tests are unavailable."
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes, hub installed|_ACE_SETUP_CHOOSE_HUB|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button No hub|_ACE_SETUP_CHOOSE_HUBLESS"
  RESPOND TYPE=command MSG="action:prompt_footer_button Exit setup|_ACE_SETUP_EXIT"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _ACE_SETUP_CHOOSE_HUB]
gcode:
  _ACE_SETUP_ASSERT_IDLE
  _ACE_SETUP_CLOSE_PROMPT
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=hub_mode VALUE=1
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=1
  RESPOND TYPE=echo MSG="ACE setup: writing hub config and scheduling Klipper restart..."
  RESPOND TYPE=command MSG="action:prompt_begin ACE Initial Setup"
  RESPOND TYPE=command MSG="action:prompt_text Writing managed hub sensor config (ace-hardware.cfg)."
  RESPOND TYPE=command MSG="action:prompt_text Klipper will restart. Wait about 45 seconds, then the wizard resumes automatically."
  RESPOND TYPE=command MSG="action:prompt_show"
  RUN_SHELL_COMMAND CMD=ace_setup PARAMS="apply_hub"
  RUN_SHELL_COMMAND CMD=ace_setup_restart_klipper

[gcode_macro _ACE_SETUP_CHOOSE_HUBLESS]
gcode:
  _ACE_SETUP_ASSERT_IDLE
  _ACE_SETUP_CLOSE_PROMPT
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=hub_mode VALUE=0
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=1
  RESPOND TYPE=echo MSG="ACE setup: writing hub-less config and scheduling Klipper restart..."
  RESPOND TYPE=command MSG="action:prompt_begin ACE Initial Setup"
  RESPOND TYPE=command MSG="action:prompt_text Writing hub-less config (no hub sensor)."
  RESPOND TYPE=command MSG="action:prompt_text Klipper will restart. Wait about 45 seconds, then the wizard finishes automatically."
  RESPOND TYPE=command MSG="action:prompt_show"
  RUN_SHELL_COMMAND CMD=ace_setup PARAMS="apply_hubless"
  RUN_SHELL_COMMAND CMD=ace_setup_restart_klipper

[gcode_macro _ACE_SETUP_AFTER_HUB_RESTART]
gcode:
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=hub_mode VALUE=1
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=lane VALUE=1
  ACE_SET_SENSOR_NAME NAME=HUB
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set sensor_name = cfg.sensor_name|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% if sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("ACE setup: hub sensor '" ~ sensor_name ~ "' is not configured after restart") }
  {% elif printer[sensor_object].filament_detected|int %}
    _ACE_SETUP_PROMPT_CLEAR_HUB
  {% else %}
    RESPOND TYPE=echo MSG="ACE setup: hub sensor '{sensor_name}' present and clear"
    _ACE_SETUP_PROMPT_LANE
  {% endif %}

[gcode_macro _ACE_SETUP_PROMPT_CLEAR_HUB]
gcode:
  _ACE_SETUP_CLOSE_PROMPT
  RESPOND TYPE=command MSG="action:prompt_begin ACE Initial Setup — Clear hub"
  RESPOND TYPE=command MSG="action:prompt_text The hub filament sensor is currently triggered."
  RESPOND TYPE=command MSG="action:prompt_text Remove filament from the hub path so the sensor is clear, then continue."
  RESPOND TYPE=command MSG="action:prompt_footer_button Hub is clear|_ACE_SETUP_AFTER_HUB_RESTART|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Exit setup|_ACE_SETUP_EXIT"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _ACE_SETUP_AFTER_HUBLESS_RESTART]
gcode:
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=hub_mode VALUE=0
  SET_GCODE_VARIABLE MACRO=_ACE_CONFIG VARIABLE=sensor_name VALUE='""'
  _ACE_SETUP_FINISH_HUBLESS

[gcode_macro _ACE_SETUP_VALIDATE_HUB]
gcode:
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set sensor_name = cfg.sensor_name|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% if sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("ACE setup: hub sensor '" ~ sensor_name ~ "' is not configured after restart") }
  {% elif printer[sensor_object].filament_detected|int %}
    { action_raise_error("ACE setup: hub sensor is triggered — clear filament from the hub, then continue") }
  {% endif %}
  RESPOND TYPE=echo MSG="ACE setup: hub sensor '{sensor_name}' present and clear"

[gcode_macro _ACE_SETUP_PROMPT_LANE]
gcode:
  {% set st = printer["gcode_macro _ACE_SETUP_STATE"] %}
  {% set lane = st.lane|int %}
  {% if lane < 1 or lane > 4 %}
    _ACE_SETUP_FINISH_HUB
  {% else %}
    _ACE_SETUP_CLOSE_PROMPT
    RESPOND TYPE=command MSG="action:prompt_begin ACE Initial Setup — Lane {lane}"
    RESPOND TYPE=command MSG="action:prompt_text Insert filament into ACE lane {lane} until the ACE grips it."
    RESPOND TYPE=command MSG="action:prompt_text The hub sensor must be clear. Test feeds slowly (8 mm/s, max 1200 mm) until the hub triggers, then retracts until the hub is clear."
    RESPOND TYPE=command MSG="action:prompt_text If the test fails, recover any Klipper error, then use Retry / ACE_SETUP_RETRY. Do not skip ahead."
    RESPOND TYPE=command MSG="action:prompt_footer_button Test lane {lane}|_ACE_SETUP_TEST_LANE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Exit setup|_ACE_SETUP_EXIT"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _ACE_SETUP_PROMPT_LANE_FAIL]
gcode:
  {% set st = printer["gcode_macro _ACE_SETUP_STATE"] %}
  {% set lane = st.lane|int %}
  _ACE_SETUP_CLOSE_PROMPT
  RESPOND TYPE=command MSG="action:prompt_begin ACE Setup — Lane {lane} failed"
  RESPOND TYPE=command MSG="action:prompt_text The last lane test did not complete successfully."
  RESPOND TYPE=command MSG="action:prompt_text Check ACE connectivity (ACE_CHECK) — if the ACE dropped off USB, power-cycle it and reseat the rear cable. Clear the hub path and ensure filament is seated in lane {lane}."
  RESPOND TYPE=command MSG="action:prompt_text Retry this lane, stop the wizard (keeps progress unset), or exit setup."
  RESPOND TYPE=command MSG="action:prompt_footer_button Retry|_ACE_SETUP_TEST_LANE|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Stop|_ACE_SETUP_STOP"
  RESPOND TYPE=command MSG="action:prompt_footer_button Exit setup|_ACE_SETUP_EXIT"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _ACE_SETUP_TEST_LANE]
gcode:
  _ACE_SETUP_ASSERT_IDLE
  {% set cfg = printer["gcode_macro _ACE_CONFIG"] %}
  {% set st = printer["gcode_macro _ACE_SETUP_STATE"] %}
  {% set lane = st.lane|int %}
  {% set sensor_name = cfg.sensor_name|string %}
  {% set sensor_object = "filament_switch_sensor " ~ sensor_name %}
  {% set length = cfg.load_to_sensor_search_mm|float %}

  {% if not st.active|int or st.hub_mode|int != 1 %}
    { action_raise_error("ACE setup lane test refused: hub setup is not active") }
  {% elif lane < 1 or lane > 4 %}
    { action_raise_error("ACE setup lane test refused: invalid lane") }
  {% elif sensor_name == "" or sensor_object not in printer %}
    { action_raise_error("ACE setup lane test refused: hub sensor missing") }
  {% elif printer[sensor_object].filament_detected|int %}
    { action_raise_error("ACE setup lane test refused: hub sensor already triggered — clear the hub first") }
  {% endif %}

  _ACE_SETUP_CLOSE_PROMPT
  # Announce ACE link state first: a USB drop otherwise surfaces as a confusing
  # "sensor is not triggered" error from the verify step.
  RUN_SHELL_COMMAND CMD=ace_rpc PARAMS="health"
  RESPOND TYPE=echo MSG="ACE setup: testing lane {lane} (feed 8 mm/s to hub, then retract clear)..."
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=last_error VALUE='""'

  # Reuse production motion helpers — bounded search, blocking, verified.
  _ACE_LOAD_TO_SENSOR SLOT={lane} LENGTH={length} SPEED=8 SENSOR={sensor_name}
  _ACE_UNLOAD_TO_SENSOR SLOT={lane} SPEED=8 SENSOR={sensor_name}
  _ACE_CLEAR_HUB SLOT={lane} SPEED=8 SENSOR={sensor_name}
  _ACE_VERIFY_SENSOR_CLEAR SENSOR={sensor_name}

  RESPOND TYPE=echo MSG="ACE setup: lane {lane} OK"
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=lane VALUE={lane + 1}
  {% if lane >= 4 %}
    _ACE_SETUP_FINISH_HUB
  {% else %}
    _ACE_SETUP_PROMPT_LANE
  {% endif %}

[gcode_macro _ACE_SETUP_FINISH_HUB]
gcode:
  RUN_SHELL_COMMAND CMD=ace_setup PARAMS="mark_complete"
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=lane VALUE=1
  _ACE_SETUP_CLOSE_PROMPT
  RESPOND TYPE=command MSG="action:prompt_begin ACE Initial Setup complete"
  RESPOND TYPE=command MSG="action:prompt_text Hub mode configured. Lanes 1-4 were fed to the hub sensor and retracted clear."
  RESPOND TYPE=command MSG="action:prompt_text Setup will not auto-prompt again. Re-run anytime with ACE_INITIAL_SETUP."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_ACE_SETUP_CLOSE_PROMPT|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  RESPOND TYPE=echo MSG="ACE Initial Setup complete (hub)"

[gcode_macro _ACE_SETUP_FINISH_HUBLESS]
gcode:
  RUN_SHELL_COMMAND CMD=ace_setup PARAMS="mark_complete"
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=0
  _ACE_SETUP_CLOSE_PROMPT
  RESPOND TYPE=command MSG="action:prompt_begin ACE Initial Setup complete"
  RESPOND TYPE=command MSG="action:prompt_text Hub-less mode configured (variable_sensor_name is empty)."
  RESPOND TYPE=command MSG="action:prompt_text Lane-to-hub tests were skipped. Use toolhead-sensor / blind load paths for feeding."
  RESPOND TYPE=command MSG="action:prompt_text Setup will not auto-prompt again. Re-run anytime with ACE_INITIAL_SETUP."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_ACE_SETUP_CLOSE_PROMPT|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  RESPOND TYPE=echo MSG="ACE Initial Setup complete (hub-less)"

[gcode_macro _ACE_SETUP_STOP]
gcode:
  # Leave completion unset so setup can appear again after restart.
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=last_error VALUE='"stopped"'
  _ACE_SETUP_CLOSE_PROMPT
  RESPOND TYPE=echo MSG="ACE setup stopped (completion marker not set)"

[gcode_macro _ACE_SETUP_EXIT]
gcode:
  # Exit setup without marking complete — first-run prompt returns after restart.
  RUN_SHELL_COMMAND CMD=ace_setup PARAMS="clear_complete"
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=hub_mode VALUE=-1
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=lane VALUE=1
  SET_GCODE_VARIABLE MACRO=_ACE_SETUP_STATE VARIABLE=last_error VALUE='"exited"'
  _ACE_SETUP_CLOSE_PROMPT
  RESPOND TYPE=echo MSG="ACE setup exited (completion marker cleared; will prompt again after restart)"
